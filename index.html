<!DOCTYPE html>
<!--
  PAC-MAN AR – ESCAPE FROM THE POSTER
  Scan the poster: Pac-Man and the ghosts escape into the room, chase, power pellet, portal ending.

  Open with ?demo=1 to watch the story without a camera (a virtual poster is shown instead).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pac-Man AR – Escape from the Poster</title>

    <!-- A-Frame 1.5.0 is the version MindAR 1.2.5 is built and documented against. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script src="js/sfx.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/sticky-anchor.js"></script>
    <script src="js/story.js"></script>

    <style>
      /* No background colour on html/body: MindAR places the camera video BEHIND the page. */
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Arial Black', sans-serif; }
      #start-overlay {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: rgba(4, 4, 26, 0.92); color: #ffd800; text-align: center; cursor: pointer;
      }
      #start-overlay h1 { margin: 0 0 8px; font-size: 34px; text-shadow: 0 0 12px #2121ff; }
      #start-overlay h2 { margin: 0 0 24px; font-size: 16px; color: #ff4fa0; letter-spacing: 1px; }
      #start-overlay p { margin: 0; color: #fff; font-family: sans-serif; font-size: 16px; }
      #status {
        position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9000;
        padding: 8px 14px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #fff;
        font-family: sans-serif; font-size: 14px; white-space: nowrap;
      }
      #replay {
        display: none; position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 9000;
        padding: 14px 28px; border: 3px solid #2121ff; border-radius: 30px; background: #ffd800; color: #000;
        font-family: 'Arial Black', sans-serif; font-size: 18px; cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="start-overlay">
      <h1>PAC-MAN AR</h1>
      <h2>ESCAPE FROM THE POSTER</h2>
      <p>Tap to start · sound on 🔊</p>
    </div>
    <div id="status">Waiting to start…</div>
    <button id="replay">▶ PLAY AGAIN</button>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets/poster.mind; autoStart: false; uiScanning: yes; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 0.01"
      color-space="sRGB"
      renderer="colorManagement: true; antialias: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

      <a-light type="ambient" intensity="0.9"></a-light>
      <a-light type="directional" intensity="1.2" position="0.4 1 1"></a-light>

      <!-- MindAR moves this entity onto the poster (kept empty). -->
      <a-entity id="poster-target" mindar-image-target="targetIndex: 0"></a-entity>

      <!-- All content lives here. sticky-anchor copies the poster position, and keeps
           everything in place (using the gyroscope) when the poster leaves the camera view.
           Poster space: centre 0,0  width 1  height 1.414  +Z = toward the viewer. -->
      <a-entity id="world" sticky-anchor="target: #poster-target" pac-story></a-entity>
    </a-scene>

    <script>
      const DEMO = new URLSearchParams(location.search).has('demo');
      const overlay = document.getElementById('start-overlay');
      const status = document.getElementById('status');
      const replay = document.getElementById('replay');
      const sceneEl = document.querySelector('a-scene');
      const target = document.getElementById('poster-target');
      const world = document.getElementById('world');

      overlay.addEventListener('click', async () => {
        overlay.style.display = 'none';
        PAC.sfx.unlock();                 // audio must be unlocked by a tap
        const gyro = PAC.enableGyro();    // iPhone asks for motion permission here (must be first await)
        if (DEMO) return startDemo();
        status.textContent = 'Starting camera…';
        await gyro;
        try {
          await sceneEl.systems['mindar-image-system'].start();
          status.textContent = 'Point the camera at the Pac-Man poster';
        } catch (err) {
          console.error(err);
          status.textContent = 'Camera error: ' + err.message + ' (allow camera, use HTTPS)';
        }
      });

      target.addEventListener('targetFound', () => { status.textContent = 'Poster found ✅'; });
      target.addEventListener('targetLost', () => {
        status.textContent = 'Poster out of view – characters stay in the room';
      });
      world.addEventListener('story-done', () => { replay.style.display = 'block'; });
      replay.addEventListener('click', () => {
        replay.style.display = 'none';
        PAC.sfx.unlock();
        world.components['pac-story'].restart();
      });
      world.addEventListener('story-waiting', () => {
        status.textContent = '📷 Scan the poster to play again';
      });

      // Demo mode: no camera. Show a virtual poster 2.2 m in front of the camera and pretend it was found.
      function startDemo() {
        status.textContent = 'DEMO MODE (no camera)';
        document.body.style.background = '#223';
        const T = AFRAME.THREE;
        const m = new T.Matrix4().compose(new T.Vector3(0, -0.05, -2.3),
          new T.Quaternion().setFromEuler(new T.Euler(-0.15, 0.25, 0)), new T.Vector3(1, 1, 1));
        target.object3D.matrixAutoUpdate = false;
        const poster = document.createElement('a-plane');
        poster.setAttribute('src', 'assets/targets/poster_target.jpg');
        poster.setAttribute('width', 1);
        poster.setAttribute('height', 4961 / 3508);
        poster.setAttribute('material', 'shader: flat');
        target.appendChild(poster);
        // same order as MindAR: "found" is announced first, the poster matrix arrives right after
        target.object3D.matrix.makeScale(0, 0, 0);
        target.emit('targetFound');
        target.object3D.visible = true;
        target.object3D.matrix.copy(m);
      }
    </script>
  </body>
</html>
